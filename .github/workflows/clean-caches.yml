---
name: Clean Caches

on:
  workflow_call:

permissions:
  actions: write
  contents: read

jobs:
  clean-caches:
    runs-on: ubuntu-latest
    steps:
      - name: Clean caches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF_NAME: ${{ github.head_ref }}
        run: |
          set -e
          PR_REF="refs/pull/${PR_NUMBER}/merge"
          HEAD_REF="refs/heads/${HEAD_REF_NAME}"

          echo "Caches for PR ref ${PR_REF}:"
          gh cache list --repo "$REPO" --ref "$PR_REF" --limit 100
          echo "Deleting caches for PR ref..."
          gh cache delete --all --repo "$REPO" --ref "$PR_REF" --succeed-on-no-caches

          echo "Caches for head ref ${HEAD_REF}:"
          gh cache list --repo "$REPO" --ref "$HEAD_REF" --limit 100
          echo "Deleting caches for head ref..."
          gh cache delete --all --repo "$REPO" --ref "$HEAD_REF" --succeed-on-no-caches

          echo "Caches cleaned successfully"
