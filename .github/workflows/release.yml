---
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: "Dry-run mode"
        required: true
        default: true
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_PAT }}

      - name: Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
        with:
          semantic_version: 25.0.9
          dry_run: ${{ inputs.dry_run || !github.event_name == 'schedule' }}
          # Pin all plugins. Preset must stay on v9 until release-notes-generator v15
          # (writer@9) is stable — v10 requires conventional-changelog-writer@9+.
          # See: https://github.com/semantic-release/release-notes-generator/issues/992
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
            @semantic-release/github@12.0.9
            conventional-changelog-conventionalcommits@9.3.1
