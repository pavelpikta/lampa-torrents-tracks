---
name: lampa-torrents-tracks

services:
  lampa-torrents-tracks:
    image: ghcr.io/pavelpikta/lampa-torrents-tracks:latest
    container_name: lampa-torrents-tracks
    hostname: lampa-torrents-tracks
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HTTP_PORT=3000
      - TORRSERVER_URL=http://host.docker.internal:8090
      - TORRSERVER_USERNAME=
      - TORRSERVER_PASSWORD=
      - TORRSERVER_METADATA_MAX_ATTEMPTS=60
      - TORRSERVER_METADATA_ATTEMPT_DELAY=1000
      - TORRSERVER_REQUEST_TIMEOUT_MS=60000
      - TORRSERVER_RESPONSE_MAX_BYTES=5242880
      - CACHE_MAX_SIZE=1000
      - CACHE_TTL_MS=3600000
      - CACHE_CLEANUP_INTERVAL_MS=600000
      - RATE_LIMIT_MAX_REQUESTS=120
      - RATE_LIMIT_WINDOW_MS=60000
      # TRUSTED_PROXY_IPS=  # optional: comma-separated proxy IPs when behind reverse proxy (client IP for rate limit)
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - lampa-torrents-tracks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Accept 200 (ok) and 503 (degraded — TorrServer unreachable but our server is alive).
      # This prevents restart loops when TorrServer is temporarily unavailable.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:' + (process.env.HTTP_PORT || 3000) + '/health', (r) => {process.exit(r.statusCode === 200 || r.statusCode === 503 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  lampa-torrents-tracks:
    driver: bridge
